# AgentSync Configuration
# Synchronize single-source AI instructions, skills, and commands across all coding agents.
# 
# Source directory (relative to this config file)
source_dir = "."

# Gitignore management
[gitignore]
enabled = true
marker = "AI Agent Symlinks"

# =============================================================================
# Agent Targets
# =============================================================================

# Claude Code (Anthropic)
[agents.claude]
enabled = true
description = "Claude Code - Anthropic CLI"

[agents.claude.targets.instructions]
source = "AGENTS.md"
destination = "CLAUDE.md"
type = "symlink"

[agents.claude.targets.skills]
source = "skills"
destination = ".claude/skills"
type = "symlink"

# Google Antigravity
[agents.antigravity]
enabled = true
description = "Google Antigravity"

[agents.antigravity.targets.instructions]
source = "AGENTS.md"
destination = "ANTIGRAVITY.md"
type = "symlink"

[agents.antigravity.targets.skills]
source = "skills"
destination = ".antigravity/skills"
type = "symlink"

# Gemini CLI
[agents.gemini]
