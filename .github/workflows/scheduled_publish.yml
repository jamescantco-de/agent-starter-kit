name: JCC Cloud Scheduled Publisher

on:
  schedule:
    # 09:00 UTC = 10:00 BST (Sundays, Mondays, and Thursdays - Primary Morning Drop)
    - cron: '0 9 * * 0,1,4'
    # 09:25 UTC = 10:25 BST (Sundays, Mondays, and Thursdays - Golden Hour Co-Pilot Pass 1)
    - cron: '25 9 * * 0,1,4'
    # 09:50 UTC = 10:50 BST (Sundays, Mondays, and Thursdays - Golden Hour Co-Pilot Pass 2)
    - cron: '50 9 * * 0,1,4'
    # 14:30 UTC = 15:30 BST (Sundays, Mondays, and Thursdays - Afternoon US Wave & Radar)
    - cron: '30 14 * * 0,1,4'
  workflow_dispatch:
    inputs:
      force:
        description: 'Drop name or script to force (e.g. superskills), or leave blank for auto/catch-up'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run Cloud Dispatcher
        env:
          JCC_X_API_KEY: ${{ secrets.JCC_X_API_KEY }}
          JCC_X_API_SECRET: ${{ secrets.JCC_X_API_SECRET }}
          JCC_X_ACCESS_TOKEN: ${{ secrets.JCC_X_ACCESS_TOKEN }}
          JCC_X_ACCESS_SECRET: ${{ secrets.JCC_X_ACCESS_SECRET }}
          BSKY_IDENTIFIER: ${{ secrets.BSKY_IDENTIFIER }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          if [ -n "${{ inputs.force }}" ]; then
            node scripts/cloud_dispatcher.mjs --force="${{ inputs.force }}"
          else
            node scripts/cloud_dispatcher.mjs --catch-up
          fi

      - name: Commit & Push Published State
        run: |
          git config --global user.name "James Can't Code Bot"
          git config --global user.email "bot@jamescantco.de"
          git add -f published*.json 2>/dev/null || true
          if [ -f .replied_history.json ]; then
            git add -f .replied_history.json
          fi
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto): record published state and reply history [skip ci]"
            git push origin main
          else
            echo "No new state files to commit."
          fi

